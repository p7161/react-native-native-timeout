name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
          build-root-directory: android
          arguments: assembleRelease

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - name: Install CocoaPods dependencies
        if: ${{ hashFiles('example/ios/**') != '' }}
        run: pod install --project-directory=example/ios
      - name: Build with xcodebuild
        if: ${{ hashFiles('example/ios/NativeTimeoutExample.xcworkspace/**') != '' }}
        run: |
          xcodebuild \
            -workspace example/ios/NativeTimeoutExample.xcworkspace \
            -scheme NativeTimeoutExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            build
